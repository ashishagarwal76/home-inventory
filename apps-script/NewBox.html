<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Inventory – New Box</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; padding: 16px; background: #f3f7f9;
      color: #183440; font-family: system-ui, sans-serif;
    }
    main {
      max-width: 520px; margin: 8px auto; padding: 24px;
      background: white; border: 1px solid #dbe5ea; border-radius: 14px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .help { color: #536873; font-size: 14px; line-height: 1.5; }
    fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input, textarea, button {
      width: 100%; border-radius: 8px; padding: 12px;
      font: inherit; font-size: 16px;
    }
    input, textarea { border: 1px solid #b7c9d1; background: white; }
    textarea { resize: vertical; }
    input:focus, textarea:focus {
      outline: 2px solid #26718d; outline-offset: 2px;
    }
    input:disabled, textarea:disabled { background: #f0f4f6; }
    button {
      border: 0; margin-top: 20px; min-height: 48px;
      background: #165d78; color: white; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #result {
      margin: 18px 0 0; padding: 12px; border-radius: 8px;
      white-space: pre-line; overflow-wrap: anywhere; line-height: 1.5;
    }
    .info { background: #edf4f7; color: #274957; }
    .success { background: #e8f5ec; color: #185b32; }
    .error { background: #fff0ef; color: #92372f; }
    select {
      width: 100%; border-radius: 8px; padding: 12px;
      font: inherit; font-size: 16px;
      border: 1px solid #b7c9d1; background: white;
    }
    select:focus { outline: 2px solid #26718d; outline-offset: 2px; }
    select:disabled { background: #f0f4f6; }

    #photoFields { margin-top: 24px; }
    #photoFields legend { font-weight: 600; margin-bottom: 10px; padding: 0; }
    .photoButtons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .photoButtons button { margin-top: 0; }
    .secondary { background: #edf4f7; color: #165d78; border: 1px solid #b7c9d1; }
    #cropCanvas {
      display: block; width: 100%; max-width: 360px; aspect-ratio: 1;
      margin: 14px auto; border-radius: 8px; background: #e8eef1;
      touch-action: none; cursor: grab;
    }
    #cropZoom { padding: 0; border: 0; min-height: 38px; }
  </style>
</head>
<body>
<main>
  <h1>New Box</h1>
  <p class="help">Store this box in a location or inside another box. A photo is optional.</p>

  <form id="newBoxForm">
    <fieldset id="fields">
      <label for="boxName">Box name</label>
      <input id="boxName" type="text" required autocomplete="off">
      <label for="locationID">Placement (location or parent box)</label>
      <select id="locationID" required>
        <option value="">Select a location or parent box</option>
      </select>
      <label for="notes">Notes (optional)</label>
      <textarea id="notes" rows="3"></textarea>
    </fieldset>
    <button id="refreshLocations" type="button" class="secondary">Refresh destinations</button>


    <fieldset id="photoFields">
      <legend>Photo (optional)</legend>
      <div class="photoButtons">
        <button id="cameraButton" type="button" class="secondary">Take a photo</button>
        <button id="galleryButton" type="button" class="secondary">Choose a photo</button>
      </div>
      <input id="camera" type="file" accept="image/*" capture="environment" hidden>
      <input id="gallery" type="file" accept="image/*" hidden>
      <div id="cropArea" hidden>
        <p class="help">Drag the photo to position it, then adjust Zoom.</p>
        <canvas id="cropCanvas" width="600" height="600"
                aria-label="Photo crop preview"></canvas>
        <label for="cropZoom">Zoom</label>
        <input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1">
        <button id="removePhoto" type="button" class="secondary">Remove photo</button>
      </div>
    </fieldset>

    <button id="finishWithoutPhoto" type="button" class="secondary" hidden>
      Finish without photo
    </button>

    <button id="saveButton" type="submit">Create box</button>
    <button id="nextButton" type="button" hidden>Create another box</button>
  </form>

  <p id="result" class="info" role="status" aria-live="polite"></p>
</main>

<script>
  const $ = id => document.getElementById(id);
  const storageKey = "homeInventory.pendingNewBox.v1";
  const fieldIDs = ["boxName", "locationID", "notes"];
  const uuid = "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}";
  const boxPattern = new RegExp("^NEWBOX-" + uuid + "$", "i");
  const photoPattern = new RegExp("^PHOTO-" + uuid + "$", "i");
  const canvas = $("cropCanvas");
  const context = canvas.getContext("2d");

  let pending = null;
  let busy = false;
  let completed = false;
  let blocked = false;
  let operationVersion = 0;
  let optionsReady = false;
  let optionsLoading = false;
  let optionsVersion = 0;
  let cropImage = null;
  let baseScale = 1;
  let zoom = 1;
  let offsetX = 0;
  let offsetY = 0;
  let drag = null;

  function show(message, type = "info") {
    $("result").textContent = message;
    $("result").className = type;
  }

  function photoEditable() {
    return !blocked && !busy && !completed && !optionsLoading &&
      (Boolean(pending) || optionsReady) && (!pending || pending.photoRejected);
  }

  function updateControls() {
    $("fields").disabled = blocked || busy || Boolean(pending) || completed || !optionsReady || optionsLoading;
    $("photoFields").disabled = !photoEditable();
    $("cropZoom").disabled = !photoEditable() || !cropImage;
    $("removePhoto").disabled = !photoEditable() || !cropImage;
    $("saveButton").hidden = completed;
    $("nextButton").hidden = !completed;
    $("finishWithoutPhoto").hidden = !(pending && pending.photoRejected);
    $("finishWithoutPhoto").disabled = blocked || busy || optionsLoading;
    $("refreshLocations").disabled = blocked || busy || Boolean(pending) || completed || optionsLoading;
    $("saveButton").disabled = blocked || busy || completed || optionsLoading ||
      (!pending && !optionsReady) ||
      Boolean(pending && pending.photoRejected && !cropImage);
    canvas.style.cursor = photoEditable() && cropImage ? "grab" : "default";

    $("saveButton").textContent = busy ? "Saving…" :
      !pending ? (cropImage ? "Create box and save photo" : "Create box") :
      !pending.boxID ? "Retry box creation" :
      pending.finished || !pending.photoRequest || pending.photoDone ? "Finish" :
      pending.photoRejected ? "Save photo" : "Retry photo upload";
  }

  function writePending(candidate) {
    try {
      sessionStorage.setItem(storageKey, JSON.stringify(candidate));
      return true;
    } catch (error) {
      busy = false;
      updateControls();
      show(
        (candidate.boxID ? "Box created: " + candidate.boxName + "\n\n" :
          !pending ? "Nothing was sent.\n\n" : "") +
        "Could not save the request for retry. Allow browser storage, " +
        "then try again.\n" + error.message,
        "error"
      );
      return false;
    }
  }

  function finishSuccess() {
    if (!pending || !pending.boxID || (pending.photoRequest && !pending.photoDone)) {
      throw new Error("The box or selected photo result is not confirmed.");
    }
    const saved = pending;
    saved.finished = true;
    busy = false;
    const message = "Box created: " + saved.boxName +
      (saved.photoDone ? "\nPhoto saved." : "\nNo photo added.") +
      "\n\nReference: " + saved.requestID;

    try {
      sessionStorage.removeItem(storageKey);
    } catch (error) {
      // Retain the confirmed result if clearing storage is temporarily blocked.
      try { sessionStorage.setItem(storageKey, JSON.stringify(saved)); } catch (_) {}
      updateControls();
      show(message + "\n\nAllow browser storage, then tap Finish " +
        "to clear this saved request before creating another box.", "success");
      return;
    }

    pending = null;
    completed = true;
    updateControls();
    show(message, "success");
  }

  function callServer(method, payload, handler, message) {
    const version = ++operationVersion;
    busy = true;
    drag = null;
    updateControls();
    show(message);

    function failed(error) {
      if (version !== operationVersion || !pending) return;
      busy = false;
      updateControls();
      show(
        (pending.boxID ? "Box created: " + pending.boxName + "\n\n" : "") +
        (method === "uploadInventoryPhoto" ? "The photo result" : "The box creation result") +
        " could not be confirmed. Use the retry button to check or finish " +
        "this same request.\n\nReference: " + payload.requestID +
        "\n" + (error && error.message ? error.message : String(error)),
        "error"
      );
    }

    try {
      const runner = google.script.run
        .withSuccessHandler(result => {
          if (version !== operationVersion || !pending) return;
          try { handler(result); } catch (error) { failed(error); }
        })
        .withFailureHandler(failed);
      runner[method](payload);
    } catch (error) {
      failed(error);
    }
  }

  function sendPending() {
    if (pending.boxID) {
      if (pending.finished || !pending.photoRequest || pending.photoDone) {
        finishSuccess();
        return;
      }
      if (!writePending(pending)) return;

      callServer("uploadInventoryPhoto", pending.photoRequest, result => {
        if (!result || typeof result.accepted !== "boolean" ||
            typeof result.message !== "string" ||
            (result.requestID && result.requestID !== pending.photoRequest.requestID)) {
          throw new Error("Unexpected photo upload response.");
        }

        busy = false;
        if (result.accepted) {
          pending.photoDone = true;
          finishSuccess();
          return;
        }

        pending.photoRejected = true;
        try { sessionStorage.setItem(storageKey, JSON.stringify(pending)); } catch (_) {}
        updateControls();
        show("Box created: " + pending.boxName + "\n\nPhoto not saved: " +
          result.message + "\nChoose another photo and tap Save photo, " +
          "or tap Finish without photo.", "error");
      }, "Box created: " + pending.boxName + "\nSaving cropped photo…");
      return;
    }

    if (!writePending(pending)) return;
    const boxRequest = { requestID: pending.requestID };
    fieldIDs.forEach(id => { boxRequest[id] = pending[id]; });
    boxRequest.photoRequest = pending.photoRequest;

    callServer("submitWebNewBox", boxRequest, result => {
      if (!result || typeof result.accepted !== "boolean" ||
          result.requestID !== pending.requestID ||
          typeof result.message !== "string" ||
          typeof result.boxID !== "string" ||
          (result.accepted && !/^BOX-\d+$/.test(result.boxID))) {
        throw new Error("Unexpected box creation response.");
      }

      busy = false;
      if (!result.accepted) {
        try {
          sessionStorage.removeItem(storageKey);
        } catch (error) {
          updateControls();
          show("Rejected: " + result.message +
            "\n\nAllow browser storage, then retry this same box request.", "error");
          return;
        }
        pending = null;
        updateControls();
        show("Rejected: " + result.message, "error");
        return;
      }

      pending.boxID = result.boxID;
      if (pending.photoRequest) pending.photoRequest.recordID = result.boxID;
      // Save the new BoxID before sending the separately tracked photo request.
      sendPending();
    }, "Creating box…");
  }

  function drawCrop() {
    if (!cropImage) return;
    const scale = baseScale * zoom;
    const width = cropImage.naturalWidth * scale;
    const height = cropImage.naturalHeight * scale;
    const limitX = Math.max(0, (width - canvas.width) / 2);
    const limitY = Math.max(0, (height - canvas.height) / 2);
    offsetX = Math.max(-limitX, Math.min(limitX, offsetX));
    offsetY = Math.max(-limitY, Math.min(limitY, offsetY));

    context.fillStyle = "#ffffff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.imageSmoothingEnabled = true;
    context.imageSmoothingQuality = "high";
    context.drawImage(cropImage,
      (canvas.width - width) / 2 + offsetX,
      (canvas.height - height) / 2 + offsetY, width, height);
  }

  async function loadCropImage(url) {
    const image = new Image();
    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(new Error("Try a JPEG or PNG photo."));
      image.src = url;
    });
    if (!image.naturalWidth || !image.naturalHeight) {
      throw new Error("The photo could not be opened.");
    }
    cropImage = image;
    baseScale = Math.max(canvas.width / image.naturalWidth,
      canvas.height / image.naturalHeight);
    zoom = 1;
    offsetX = 0;
    offsetY = 0;
    $("cropZoom").value = "1";
    $("cropArea").hidden = false;
    drawCrop();
  }

  function resetCrop() {
    cropImage = null;
    drag = null;
    $("cropArea").hidden = true;
  }

  async function preparePhoto(file) {
    if (!file || !photoEditable()) return;
    busy = true;
    resetCrop();
    updateControls();
    show("Preparing photo…");
    let objectURL;
    try {
      if (file.size > 30 * 1024 * 1024) {
        throw new Error("Choose a photo smaller than 30 MB.");
      }
      objectURL = URL.createObjectURL(file);
      await loadCropImage(objectURL);
      show((pending && pending.boxID ? "Box created: " + pending.boxName + "\n" : "") +
        "Drag the photo and adjust Zoom. Only the square shown will be saved.");
    } catch (error) {
      show(error.message, "error");
    } finally {
      if (objectURL) URL.revokeObjectURL(objectURL);
      busy = false;
      updateControls();
    }
  }

  function photoRequest(boxID) {
    if (!cropImage) throw new Error("Choose a photo first.");
    drawCrop();
    const dataURL = canvas.toDataURL("image/jpeg", 0.85);
    if (!dataURL.startsWith("data:image/jpeg;base64,") || dataURL.length > 1300000) {
      throw new Error("The cropped photo is too large to upload.");
    }
    return {
      requestID: "PHOTO-" + crypto.randomUUID(),
      recordType: "Box",
      recordID: boxID || "",
      base64: dataURL.split(",")[1]
    };
  }

  $("newBoxForm").addEventListener("submit", event => {
    event.preventDefault();
    if (blocked || busy || completed) return;
    try {
      let candidate = pending;
      if (!pending) {
        $("boxName").value = $("boxName").value.trim();
        if (!optionsReady || !$("newBoxForm").reportValidity()) return;
        candidate = {
          requestID: "NEWBOX-" + crypto.randomUUID(),
          boxID: "", photoRequest: cropImage ? photoRequest("") : null,
          photoRejected: false, photoDone: false, finished: false
        };
        fieldIDs.forEach(id => { candidate[id] = $(id).value.trim(); });
      } else if (pending.photoRejected) {
        candidate = { ...pending, photoRequest: photoRequest(pending.boxID),
          photoRejected: false, photoDone: false, finished: false };
      }
      if (!writePending(candidate)) return;
      pending = candidate;
      sendPending();
    } catch (error) {
      show((pending && pending.boxID ? "Box created: " + pending.boxName + "\n\n" : "") +
        "This attempt was not sent. " + error.message, "error");
    }
  });

  ["camera", "gallery"].forEach(id => {
    $(id + "Button").addEventListener("click", () => {
      if (photoEditable()) $(id).click();
    });
    $(id).addEventListener("change", event => {
      const file = event.target.files[0];
      event.target.value = "";
      preparePhoto(file);
    });
  });

  $("removePhoto").addEventListener("click", () => {
    if (!photoEditable()) return;
    resetCrop();
    updateControls();
    show(pending ? "Box created: " + pending.boxName +
      "\nChoose another photo, or tap Finish without photo." :
      "Photo removed. You can create this box without a photo.");
  });

  $("cropZoom").addEventListener("input", () => {
    if (!photoEditable() || !cropImage) return;
    const nextZoom = Number($("cropZoom").value);
    const ratio = nextZoom / zoom;
    offsetX *= ratio;
    offsetY *= ratio;
    zoom = nextZoom;
    drawCrop();
  });

  canvas.addEventListener("pointerdown", event => {
    if (!photoEditable() || !cropImage || drag) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
    canvas.style.cursor = "grabbing";
  });
  canvas.addEventListener("pointermove", event => {
    if (!drag || drag.id !== event.pointerId || !photoEditable()) return;
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    event.preventDefault();
    offsetX += (event.clientX - drag.x) * canvas.width / rect.width;
    offsetY += (event.clientY - drag.y) * canvas.height / rect.height;
    drag.x = event.clientX;
    drag.y = event.clientY;
    drawCrop();
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(type => {
    canvas.addEventListener(type, event => {
      if (!drag || drag.id !== event.pointerId) return;
      drag = null;
      updateControls();
    });
  });

  $("finishWithoutPhoto").addEventListener("click", () => {
    if (!pending || !pending.boxID || !pending.photoRejected || busy || blocked || optionsLoading) return;
    const candidate = { ...pending, photoRequest: null,
      photoRejected: false, photoDone: false, finished: false };
    if (!writePending(candidate)) return;
    pending = candidate;
    resetCrop();
    finishSuccess();
  });

  $("nextButton").addEventListener("click", () => {
    if (!completed || busy || blocked || pending) return;
    operationVersion++;
    $("newBoxForm").reset();
    completed = false;
    resetCrop();
    updateControls();
    loadLocationChoices();
    $("boxName").focus();
  });

  function readSavedRequest(value) {
    if (!value || typeof value !== "object" ||
        !boxPattern.test(value.requestID) ||
        !fieldIDs.every(id => typeof value[id] === "string")) {
      throw new Error("The saved box request is incomplete.");
    }
    const saved = { requestID: value.requestID, boxID: value.boxID || "" };
    fieldIDs.forEach(id => { saved[id] = value[id]; });
    if (typeof saved.boxID !== "string" ||
        (saved.boxID && !/^BOX-\d+$/.test(saved.boxID))) {
      throw new Error("The saved BoxID is invalid.");
    }
    ["photoRejected", "photoDone", "finished"].forEach(key => {
      if (value[key] !== undefined && typeof value[key] !== "boolean") {
        throw new Error("The saved request status is invalid.");
      }
      saved[key] = value[key] === true;
    });
    saved.photoRequest = value.photoRequest == null ? null : value.photoRequest;
    const photo = saved.photoRequest;
    if (photo !== null && (typeof photo !== "object" || !photoPattern.test(photo.requestID) ||
        photo.recordType !== "Box" || photo.recordID !== saved.boxID ||
        typeof photo.base64 !== "string" || !photo.base64 ||
        photo.base64.length > 1300000 ||
        !/^[A-Za-z0-9+/]+={0,2}$/.test(photo.base64))) {
      throw new Error("The saved photo request is incomplete.");
    }
    if ((saved.photoRejected && (!photo || !saved.boxID)) ||
        (saved.photoDone && (!photo || !saved.boxID)) ||
        (saved.finished && (!saved.boxID || (photo && !saved.photoDone)))) {
      throw new Error("The saved request status is inconsistent.");
    }
    return saved;
  }


  function showReadyMessage() {
    show(!pending ?
      ($("locationID").options.length < 2 ? "Create a location first, then tap Refresh destinations." :
        "Enter the box details and select a location or parent box. A photo is optional.") :
      !pending.boxID ? "An earlier box request has no confirmed result.\nBox: " +
        pending.boxName + "\nTap Retry box creation to resolve it." :
      pending.finished || !pending.photoRequest || pending.photoDone ?
        "Box created: " + pending.boxName +
        (pending.photoDone ? "\nPhoto saved." : "\nNo photo added.") +
        " Tap Finish to close this saved request." :
      pending.photoRejected ? "Box created: " + pending.boxName +
        "\nChoose another photo and tap Save photo, or tap Finish without photo." :
        "Box created: " + pending.boxName +
        "\nThe photo upload has no confirmed result. Tap Retry photo upload.");
  }

  function loadLocationChoices() {
    if (busy || optionsLoading || blocked || completed) return;
    const selected = pending ? pending.locationID : $("locationID").value;
    const version = ++optionsVersion;
    optionsLoading = true;
    optionsReady = false;
    updateControls();
    show("Loading locations and boxes…");

    function failed(error) {
      if (version !== optionsVersion) return;
      optionsLoading = false;
      optionsReady = false;
      updateControls();
      show("Could not load destinations: " +
        (error && error.message ? error.message : String(error)) +
        (pending ? "\nYou can still retry this saved box request." :
          "\nTap Refresh destinations to try again."), "error");
    }

    try {
      google.script.run
        .withSuccessHandler(options => {
          if (version !== optionsVersion) return;
          if (!options || !Array.isArray(options.locations) ||
              !options.locations.every(location => typeof location.id === "string" &&
                location.id && typeof location.label === "string") ||
              new Set(options.locations.map(location => location.id)).size !== options.locations.length) {
            failed(new Error("Unexpected location list."));
            return;
          }
          $("locationID").replaceChildren(new Option("Select a location or parent box", ""));
          options.locations.forEach(location => {
            $("locationID").add(new Option(location.label, location.id));
          });
          if (pending && selected && !options.locations.some(location => location.id === selected)) {
            $("locationID").add(new Option("Previously selected placement", selected));
          }
          $("locationID").value = selected;
          optionsLoading = false;
          optionsReady = true;
          updateControls();
          showReadyMessage();
        })
        .withFailureHandler(failed)
        .getNewBoxOptions();
    } catch (error) {
      failed(error);
    }
  }

  $("refreshLocations").addEventListener("click", () => {
    if (!pending && !busy && !completed) loadLocationChoices();
  });

  async function initializePage() {
    try {
      const saved = sessionStorage.getItem(storageKey);
      if (saved !== null) pending = readSavedRequest(JSON.parse(saved));
      if (pending) {
        fieldIDs.forEach(id => { $(id).value = pending[id]; });
        if (pending.photoRequest) {
          busy = true;
          updateControls();
          try {
            await loadCropImage("data:image/jpeg;base64," + pending.photoRequest.base64);
          } catch (_) { $("cropArea").hidden = true; }
          busy = false;
        }
      }
    } catch (error) {
      blocked = true;
      busy = false;
      updateControls();
      show("Could not read the saved request. Check NewBoxRequests, Boxes, " +
        "and the box's PhotoURL before trying again.\n" + error.message, "error");
      return;
    }

    loadLocationChoices();
  }

  initializePage();
</script>
</body>
</html>
